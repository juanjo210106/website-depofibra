name: Publicar web de Depofibra (demo o producción)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v6

      - name: Instalar y compilar Astro
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # Sin variable configurada permanece la demo; SOLO el propietario
          # activa producción creando la variable del repositorio en GitHub.
          DEPOFIBRA_SITE_URL: ${{ vars.DEPOFIBRA_SITE_URL || 'https://demo.depofibra.com' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
